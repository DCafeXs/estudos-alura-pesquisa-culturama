<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="/culturama-favico.png">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
        <img src="img/logo-culturama.png" alt="logo culturama">
    </header>   
    
    <main>
        <section>
            <form action="" METHOD="get">
                <!-- Dados Pessoais -->
                 
                <fieldset>
                    <legend>dados Pessoais</legend>

                    <label for="name">Nome</label>
                    <input id=name type="text" name="userName" required>
                    <br>
                 
                    <label for="age">idade</label>
                    <input id="age" type="number" name="userAge" min="12" max="100" required>
                    <br>
           
                    <label for="birthdate">data de nascimento</label>
                    <input id="birthdate" type="date" name="userBirthDate"> 
                    <br>
              
                    <label for="email">email</label>
                    <input id="email" type="email" name="userEmail" required>
                    <br>
                
                    <label for="phone">idade</label>
                    <input id="phone" type="tel" name="userPhone" pattern="[0-9]{11}" placeholder="ddd + numero sem espaços ou hifen">
                    <br>
        
                    <label for="image">Upload de foto</label>
                    <input id="image" type="file" accept="image/*" name="userImage">
                    <br>
                </fieldset>
                
             <fieldset>
                <legend>Perfil</legend>

                <p>Genero:</p>

                <input id="masc" type="radio" name="userGender" value="masculino"> 
                <label for="masc">masculino</label>

                <input id="fem" type="radio" name="userGender" value="feminino">
                <label for="fem">feminino</label>

                <input id="notInf" type="radio" name="userGender" value="notInformed">
                <label for="notInf">Prefiro nao informar</label>

                <br>
                
                <label for="marital">Estado civil</label>
                <select id="marital" name="maritalStatus" required>
                    <option value="">Selecione...</option>
                    <option value="casado">casado</option>
                    <option value="solteiro">solteiro</option>
                    <option value="divorciado">divorciado</option>
                    <option value="casado">uniao estavel</option>
                </select>

                <br>

                <label for="state">Estado</label>
                <select id="state" name="usarState" required>
                    <option value="">selecione...</option>
                    <option value= "Acre">Acre </option>
                    <option value= "Alagoas">Alagoas </option>
                    <option value= "Amapá">Amapá </option>
                    <option value= "Amazonas">Amazonas </option>
                    <option value= "Bahia">Bahia </option>
                    <option value= "Ceará">Ceará </option>
                    <option value= "Distrito Federal">Distrito Federal </option>
                    <option value= "Espirito Santo">Espirito Santo </option>
                    <option value= "Goiás">Goiás </option>
                    <option value= "Maranhão">Maranhão </option>
                    <option value= "Mato Grosso do Sul">Mato Grosso do Sul </option>
                    <option value= "Mato Grosso">Mato Grosso </option>
                    <option value= "Minas Gerais">Minas Gerais </option>
                    <option value= "Pará">Pará </option>
                    <option value= "Paraíba">Paraíba </option>
                    <option value= "Paraná    ">Paraná </option>
                    <option value= "Pernambuco">Pernambuco </option>
                    <option value= "Piauí">Piauí </option>
                    <option value= "Rio de Janeiro">Rio de Janeiro </option>
                    <option value= "Rio Grande do Norte">Rio Grande do Norte </option>
                    <option value= "Rio Grande do Sul">Rio Grande do Sul </option>
                    <option value= "Rondônia">Rondônia </option>
                    <option value= "Roraima">Roraima </option>
                    <option value= "Santa Catarina">Santa Catarina </option>
                    <option value= "São Paulo">São Paulo </option>
                    <option value= "Sergipe">Sergipe </option>
                    <option value= "Tocantins">Tocantins </option>
                </select>

                <br>

                <label for="city">cidade</label>
                <input id="city" type="text" name="userCity">

            </fieldset> 
                
            <fieldset>
                <legend>habitos</legend>
                
                <p>Redes sociais</p>
                <input id="inst" type="checkbox" name="social"
                value="instagram">
                <label for="inst">instagram</label>
                <input id="face" type="checkbox" name="social" value="facebook">
                <label for="face">Facebook</label>
                <input id="linkd" type="checkbox" name="social" value="linkdin">
                <label for="linkd">Linkdin</label>
                <input id="ex" type="checkbox" name="social" value="x">
                <label for="ex">x</label>

                <br>

                <label for="musicStyle">Estilo musical:</label>
                <input list="styleTypes" id="musicStyle" type="text" name="userMusicStyle">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Samba">
                    <option value="Sertanejo">     
                </datalist>

                <br>

                <label for="favoriteColor">Cor favorita</label>
                <input type="color" name="userFavoriteColor" id="favoriteColor">
            </fieldset>

            <fieldset>
                <legend>opinião</legend>
                <p>O que voce acha da qualidade do nosso serviço?</p>
                
                <input id="otimo" type="radio" name="custumerSatisfection" value="bom">
                <label for="otimo">otimo</label>

                <input id="bom" type="radio" name="custumerSatisfection" value="bom">
                <label for="bom">bom</label>

                <input id="regular" type="radio" name="custumerSatisfection" value="bom">
                <label for="regular">regular</label>

                <input id="ruim" type="radio" name="custumerSatisfection" value="bom">
                <label for="ruim">ruim</label>
                <br>
                <label for="opinion">Qual sua opinião?</label>
                <br>
                <textarea name="userOpinion" id="opinion" placeholder="Digite aqui sua opinion..."></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmaçoes</legend>

                <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="accepted" required>
                <label for="userLgpdTerm">Eu aceito participar da Pesquisa</label>
                <br>
                <input type="checkbox" name="userGetResult " id="getResult" value="accepted">
                <label for="getResult">Eu quero receber o resultado por email</label>
            </fieldset>

            <!-- botao para enviar -->
                 <button type="submit">Enviar</button>
                 <button type="reset">limpar</button>
            </form>

        
        </section>
    </main>

    <footer>

    </footer>
</body>
</html>
